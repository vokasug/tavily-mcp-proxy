log_format mcp_nosecret '$remote_addr [$time_local] $status $request_method $uri';

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name YOUR-HOST.sslip.io;       # replace with your sslip.io / nip.io / real domain
    access_log off;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name YOUR-HOST.sslip.io;       # replace with your sslip.io / nip.io / real domain

    ssl_certificate /etc/letsencrypt/live/YOUR-HOST.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR-HOST.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /mcp/ {
        proxy_pass http://127.0.0.1:8741;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        access_log /var/log/nginx/mcp_access.log mcp_nosecret;
        error_log /var/log/nginx/mcp_error.log;
    }

    location /healthz {
        proxy_pass http://127.0.0.1:8741/healthz;
        access_log off;
    }

    location / { return 404; }
}